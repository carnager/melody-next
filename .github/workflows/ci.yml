# SPDX-License-Identifier: GPL-3.0-only

name: CI

# Every push: gcc and clang build and test, clang-tidy and formatting, and
# the macOS build -- what the local gate (gcc, this machine) does not see.
# Weekly, and when asked: the sanitizers and the fuzzers, which find slow
# bugs and need not hold up a push.
on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Built and tested on Debian trixie, as the release is (packaging/docker):
# TagLib 2, FFmpeg 7, Qt 6.8. Ubuntu 24.04 has TagLib 1.13 only, which the
# build does not take, so CI had not got past configuring there.
env:
  DEPENDENCIES: >-
    build-essential cmake ninja-build pkg-config git ca-certificates
    clang clang-format clang-tidy libclang-rt-dev llvm
    qt6-base-dev libutf8proc-dev nlohmann-json3-dev
    libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev
    libebur128-dev libmpdclient-dev libopenmpt-dev libpipewire-0.3-dev
    libsqlite3-dev libtag-dev libupnp-dev libcurl4-openssl-dev libssl-dev
    pipewire pipewire-bin wireplumber dbus-daemon dbus-bin netcat-openbsd
  # The tests play through a PipeWire null sink (.github/with-silent-audio.sh);
  # configuring already reads where its socket is.
  XDG_RUNTIME_DIR: /tmp/ci-runtime
  # Shared runners time too unevenly to judge the UI budgets; they are
  # reported, and held on real hardware.
  MELODY_BENCHMARK_REPORT_ONLY: "1"
  # The null sink of a shared runner stalls now and then, so what needs audio
  # to play in real time is left to machines with a sound server: tests
  # labelled realtime (-LE realtime) and window cases that skip themselves.
  MELODY_TEST_SKIP_REALTIME: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends $DEPENDENCIES
      - uses: actions/checkout@v4
      # Lint and formatting are checked in the arch job: clang-tidy and
      # clang-format change their verdicts between versions, and Debian's
      # trail the ones the code is written with.
      - name: Configure
        run: cmake --preset dev -DCMAKE_CXX_COMPILER="$CXX"
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: .github/with-silent-audio.sh ctest --preset dev --output-on-failure -LE realtime

  sanitizers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      CC: clang
      CXX: clang++
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends $DEPENDENCIES
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: .github/with-silent-audio.sh ctest --preset asan --output-on-failure -LE realtime

  # What the people running it run: the current Arch packages, FFmpeg and
  # TagLib as they are now. Debian above is what the release is built on.
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
      XDG_RUNTIME_DIR: /tmp/ci-runtime
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja pkgconf git clang qt6-base libutf8proc nlohmann-json
          ffmpeg libebur128 libmpdclient libopenmpt taglib sqlite libupnp curl openssl
          pipewire wireplumber dbus openbsd-netcat
      - uses: actions/checkout@v4
      # Current clang, clang-tidy and clang-format: the lint gate.
      - name: Configure
        run: cmake --preset tidy
      - name: Build
        run: cmake --build --preset tidy
      - name: Test
        run: .github/with-silent-audio.sh ctest --preset tidy --output-on-failure -LE realtime
      - name: Check formatting
        run: cmake --build --preset tidy --target format-check

  fuzz-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      CXX: clang++
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends $DEPENDENCIES
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset fuzz -DCMAKE_CXX_COMPILER="$CXX"
      - name: Build
        run: cmake --build --preset fuzz
      - name: Fuzz parser
        run: >-
          ./build/fuzz/fuzz/trackknife_titleformat_parser_fuzz
          -dict=fuzz/titleformat.dict -runs=20000 -max_len=4096
      - name: Fuzz compiler and evaluator
        run: >-
          ./build/fuzz/fuzz/trackknife_titleformat_evaluator_fuzz
          -dict=fuzz/titleformat.dict -runs=20000 -max_len=4096

  # Built, not run: what Apple's clang and libc++ take -- a time zone
  # database they lack broke the Mac build before anything here saw it.
  # macOS 26's default Xcode, current as the Macs it is built on are: the
  # macOS 15 image defaults to Xcode 16.4, whose libc++ has no
  # floating-point std::from_chars.
  macos:
    runs-on: macos-26
    steps:
      - name: Toolchain
        run: c++ --version
      - name: Install build dependencies
        run: >-
          brew install cmake ninja pkgconf qt ffmpeg libopenmpt taglib libebur128
          sqlite curl openssl@3 utf8proc libupnp nlohmann-json
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          export CMAKE_PREFIX_PATH="$(brew --prefix qt)"
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          cmake --preset macos -DPKG_CONFIG_EXECUTABLE="$(brew --prefix)/bin/pkg-config"
      - name: Build
        run: cmake --build --preset macos

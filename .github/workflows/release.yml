# A release: tag vX.Y.Z and push the tag.
#
# Builds the server image for x86_64 and arm64 and publishes it to GitHub's
# container registry, and attaches melodyd, melody-agent and melody-cli for
# both as Debian 13 binaries: linked against its FFmpeg 7, PipeWire and
# TagLib, they run where those same libraries are. Arch Linux has
# packaging/arch (and the AUR); anything else, the image or a source build.
#
# And the Android app. Signed with the keystore in the repository secrets
# (see the android job); without them it is a debug build, which installs
# but cannot be updated in place by a later signed one.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/melodyd"
          echo "tags=${image}:${GITHUB_REF_NAME},${image}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker buildx build -f packaging/docker/Dockerfile --target binaries \
            --platform "linux/${{ matrix.arch }}" --output type=local,dest=dist .
          name="melody-${GITHUB_REF_NAME#v}-debian13-${{ matrix.arch }}"
          mkdir "${name}"
          cp dist/bin/* "${name}/"
          cp dist/lib/systemd/user/*.service "${name}/"
          cp LICENSE "${name}/"
          tar -czf "${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: melody-*.tar.gz

  android:
    runs-on: ubuntu-latest
    env:
      # Base64 of the keystore file, and what opens it. Set with e.g.
      #   base64 -w0 release.keystore | gh secret set MELODY_ANDROID_KEYSTORE
      KEYSTORE: ${{ secrets.MELODY_ANDROID_KEYSTORE }}
      MELODY_ANDROID_STORE_PASSWORD: ${{ secrets.MELODY_ANDROID_STORE_PASSWORD }}
      MELODY_ANDROID_KEY_ALIAS: ${{ secrets.MELODY_ANDROID_KEY_ALIAS }}
      MELODY_ANDROID_KEY_PASSWORD: ${{ secrets.MELODY_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # What android/app/build.gradle.kts builds with. The action's own
          # default asks for the long-gone "tools" package and fails.
          packages: platform-tools platforms;android-36 build-tools;37.0.0
      - name: Build
        working-directory: android
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version="0.0.0-${GITHUB_SHA::7}"
          properties="-PmelodyVersionName=${version} -PmelodyVersionCode=${GITHUB_RUN_NUMBER}"
          if [ -n "${KEYSTORE}" ]; then
            echo "${KEYSTORE}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            export MELODY_ANDROID_STORE_FILE="${RUNNER_TEMP}/release.keystore"
            ./gradlew --no-daemon assembleRelease ${properties}
            cp app/build/outputs/apk/release/app-release.apk "../melody-${version}.apk"
          else
            echo "::warning::No MELODY_ANDROID_KEYSTORE secret: attaching a debug build"
            ./gradlew --no-daemon assembleDebug ${properties}
            cp app/build/outputs/apk/debug/app-debug.apk "../melody-${version}-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: melody-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [image, binaries, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only what the release carries: the image job's build action
          # uploads a .dockerbuild record too, which this cannot download.
          pattern: "{binaries-*,android}"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            melody-*.tar.gz
            melody-*.apk
          generate_release_notes: true

# melodyd on a server: TrueNAS, a NAS, anything with Docker.
#
#   docker compose up -d
#
# Then in Trackknife: Settings → Engine → Remote engine → On the network
# picks it by name. Add the music folder as the engine sees it -- /music --
# with Folders… in its library, and Refresh.
services:
  melodyd:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: melodyd:latest
    container_name: melodyd
    # Host networking: agents connect straight to it, and it is announced
    # on the network by name (multicast DNS does not cross a bridge).
    network_mode: host
    restart: unless-stopped
    # The owner of the state directory below; match your own user.
    user: "1000:1000"
    # The settings are ./state/melodyd.conf (ADR-0286). Without a password
    # the engine stays off the network; give it the one all your engines
    # share, then restart it:
    #   docker exec melodyd melody-cli config password 'a long sentence'
    #   docker exec melodyd melody-cli config name gemenon
    #   docker compose restart melodyd
    environment:
      # Flags on top of the file, should any be wanted.
      MELODYD_OPTIONS: ""
    volumes:
      # The library, database and saved queue: keep this.
      - ./state:/state
      # The music, read-only: tags are edited in Trackknife over the
      # network share, not by the engine.
      - /mnt/music:/music:ro
      # Speakers on this machine, optional: its PipeWire, handed in. Without
      # it the engine plays on agents only.
      # - /run/user/1000/pipewire-0:/run/pipewire/pipewire-0
    # environment for the PipeWire mount above:
    #   PIPEWIRE_RUNTIME_DIR: /run/pipewire

# melodyd.conf -- the settings of a Melody engine (ADR-0286).
#
# A setting is "key = value" on a line of its own; a line starting with # is
# a comment. Every setting is commented out below, with what it does above
# it: take the # away to use it. Switches are yes or no. An option given to
# melodyd on its command line wins over this file.
#
# A change is used when the engine starts again:
#   systemctl --user restart melodyd
#
# melody-cli config KEY VALUE changes one setting, melody-cli config --edit
# opens this file and checks it before it is saved.

## This engine

# What clients and other engines call it (default: the host name).
#name = gemenon

# The password every client and engine gives: one, the same on all your
# engines. Without one the engine keeps to this machine.
#password = a long sentence nobody guesses

# Or the password on the first line of a file kept apart.
#password-file = /home/you/.config/melody/password

# Where the music is, for output agents with their own copy of it: they are
# sent paths below it.
#music-root = /srv/music

## The network

# Where clients and agents connect (default 0.0.0.0:6603, with a password).
#listen = 0.0.0.0:6603

# Where music is streamed to agents and phones (default 0.0.0.0:6604).
#http = 0.0.0.0:6604

# This machine only: no connections from the network, no streams.
#local-only = yes

# Play on the UPnP renderers on the network.
#upnp = yes

# The network interface UPnP renderers are looked for on.
#upnp-interface = eth0

# How much converted music to keep for streams and downloads, in megabytes.
#transcode-cache = 2048

## Where things are

# The socket clients on this machine use (default $XDG_RUNTIME_DIR/melodyd.sock).
#socket = /run/user/1000/melodyd.sock

# The engine's library, lists and history (default
# ~/.local/share/melody/engine).
#state = /srv/melody

## Playing for other engines

# Let the other engines play on this machine's speakers. On by default when
# there is a password.
#agent = no

# Their password, when it is not this engine's own.
#agent-password = theirs
#agent-password-file = /home/you/.config/melody/their-password

# Where their music is mounted here; without it, it is streamed.
#agent-music-root = /mnt/nas/music

# What is streamed here on this machine's own network, and through a VPN or a
# router: original, or opus and a bit rate from 16 to 512.
#agent-stream-home = original
#agent-stream-away = opus 128

# An engine played for otherwise than the rest, by the name it goes by. Any
# of the settings below, and as many such sections as there are engines.
# Sections come last: every setting after one is that engine's.
#[engine gemenon]

# Its address, used while the network does not find it (over WireGuard).
#address = 192.168.0.200:6603

# Where its music is mounted here, and what is streamed from it.
#music-root = /mnt/gemenon
#stream-home = original
#stream-away = opus 96

# Its password, when it is not the one above.
#password = its own
#password-file = /home/you/.config/melody/gemenon-password

# Never play for it.
#agent = no
